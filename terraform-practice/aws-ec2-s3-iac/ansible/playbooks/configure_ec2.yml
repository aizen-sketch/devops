---
- name: Configure EC2 server
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Get Terraform EC2 public IP
      ansible.builtin.command:
        cmd: terraform output -raw ec2_public_ip
        chdir: "{{ terraform_dir }}"
      register: ec2_ip
      changed_when: false

    - name: Get Terraform generated private key path
      ansible.builtin.set_fact:
        private_key_path: "{{ terraform_dir }}/todo-ec2-key.pem"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ ec2_ip.stdout }}"
        port: 22
        delay: 10
        timeout: 300
        state: started

    - name: Add EC2 dynamically
      ansible.builtin.add_host:
        name: todo_ec2
        groups: todo_servers
        ansible_host: "{{ ec2_ip.stdout }}"
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "{{ private_key_path }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"


- name: Configure Todo EC2
  hosts: todo_servers
  become: true
  gather_facts: true

  tasks:

    - name: Update packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Check Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout
