---
- name: Deploy AWS infrastructure using Terraform
  hosts: terraform
  gather_facts: false

  roles:
    - terraform

  post_tasks:

    - name: Display S3 bucket
      ansible.builtin.debug:
        msg: >
          S3 Bucket:
          {{ terraform_output.s3_bucket_name.value }}
      when:
        - terraform_output is defined
        - terraform_output.s3_bucket_name is defined

    - name: Display EC2 instance ID
      ansible.builtin.debug:
        msg: >
          EC2 Instance ID:
          {{ terraform_output.ec2_instance_id.value }}
      when:
        - terraform_output is defined
        - terraform_output.ec2_instance_id is defined

    - name: Display EC2 public IP
      ansible.builtin.debug:
        msg: >
          EC2 Public IP:
          {{ terraform_output.ec2_public_ip.value }}
      when:
        - terraform_output is defined
        - terraform_output.ec2_public_ip is defined

    - name: Display EC2 public DNS
      ansible.builtin.debug:
        msg: >
          EC2 Public DNS:
          {{ terraform_output.ec2_public_dns.value }}
      when:
        - terraform_output is defined
        - terraform_output.ec2_public_dns is defined
