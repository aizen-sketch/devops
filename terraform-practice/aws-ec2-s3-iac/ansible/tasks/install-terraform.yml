---
- name: Create tools directory
  ansible.builtin.file:
    path: "{{ tools_dir }}"
    state: directory
    mode: "0755"

- name: Detect system architecture
  ansible.builtin.command:
    cmd: uname -m
  register: system_arch
  changed_when: false

- name: Set Terraform architecture
  ansible.builtin.set_fact:
    terraform_arch: >-
      {{ 'arm64' if system_arch.stdout in ['aarch64', 'arm64']
         else 'amd64' }}

- name: Check Terraform binary
  ansible.builtin.stat:
    path: "{{ terraform_binary }}"
  register: terraform_binary_stat

- name: Download Terraform
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ terraform_arch }}.zip"
    dest: "/tmp/terraform.zip"
    mode: "0644"
  when: not terraform_binary_stat.stat.exists

- name: Extract Terraform
  ansible.builtin.unarchive:
    src: "/tmp/terraform.zip"
    dest: "{{ tools_dir }}"
    remote_src: true
    mode: "0755"
  when: not terraform_binary_stat.stat.exists

- name: Verify Terraform binary exists
  ansible.builtin.stat:
    path: "{{ terraform_binary }}"
  register: terraform_after_install

- name: Fail if Terraform was not installed
  ansible.builtin.fail:
    msg: "Terraform binary was not found at {{ terraform_binary }}"
  when: not terraform_after_install.stat.exists

- name: Check Terraform version
  ansible.builtin.command:
    cmd: "{{ terraform_binary }} version"
  register: terraform_version_output
  changed_when: false

- name: Display Terraform version
  ansible.builtin.debug:
    var: terraform_version_output.stdout